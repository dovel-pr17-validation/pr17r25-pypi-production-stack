name: helm-unittest

on:
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/helm-unittest.yml"
  push:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/helm-unittest.yml"

permissions:
  contents: read

jobs:
  helm-unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v3.22.0
    - name: Install helm-unittest
      run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1
    - name: Run helm unittest
      run: helm unittest helm
